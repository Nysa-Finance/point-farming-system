# Scoring rules and safety guards, tested on every push. points_core.py is stdlib-only by
# design, so this needs no RPC key, no network and no dependency install.
name: Tests

on:
  push:
  pull_request:
  workflow_call:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -v -p 'test_*.py'
